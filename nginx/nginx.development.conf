worker_processes auto;
error_log /var/log/nginx/nginxerror.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 10.0.2.3 valid=30s;
    limit_req_status 429;

    log_format json_combined escape=json
        '{'
          '"timestamp":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"request":"$request",'
          '"status":$status,'
          '"body_bytes_sent":$body_bytes_sent,'
          '"http_referer":"$http_referer",'
          '"http_user_agent":"$http_user_agent",'
          '"request_time":$request_time,'
          '"upstream_response_time":"$upstream_response_time",'
          '"component":"nginx",'
          '"logtype":"access",'
          '"service_name":"syntheticlc-api"'
        '}';

    map $request_uri $loggable_request {
        default 1;
        ~^/health$ 0;
    }

    access_log /var/log/nginx/nginxaccess.log json_combined if=$loggable_request;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    large_client_header_buffers 4 16k;
    client_header_buffer_size 1k;
    client_max_body_size 1M;
    client_body_timeout 10s;
    client_body_buffer_size 128k;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://slc.dihola.io:8443; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Download-Options "noopen" always;

    map $http_origin $cors_origin {
        default "";
        "https://discernible.rodit.org:2443" "$http_origin";
        "https://mainnet.rodit.org:6443" "$http_origin";
        "https://purchase.discernible.io:4443" "$http_origin";
        "https://slc.dihola.io:8443" "$http_origin";
    }

    map $http_x_request_id $incoming_request_id {
        default $http_x_request_id;
        "" $http_x_correlation_id;
    }
    map $incoming_request_id $edge_request_id {
        default $incoming_request_id;
        "" $request_id;
    }

    map $uri $public_rate_limit_key {
        default "";
        "/" $remote_addr;
        "~^/api/login(?:$|/)" $remote_addr;
        "~^/api/logout(?:$|/)" $remote_addr;
        "~^/api/signclient(?:$|/)" $remote_addr;
        "~^/api/mcp(?:$|/)" $remote_addr;
        "~^/api/home(?:$|/)" $remote_addr;
        "~^/api-docs(?:$|/)" $remote_addr;
    }

    limit_req_zone $public_rate_limit_key zone=public_api_limit:20m rate=1101r/m;

    server {
        listen 8443 ssl;
        http2 on;
        server_name slc.dihola.io;
        ssl_certificate /app/certs/fullchain.pem;
        ssl_certificate_key /app/certs/privkey.pem;

        proxy_hide_header X-Powered-By;

        # MCP streamable HTTP / SSE — disable buffering (matches idclawserver-idc)
        location = /mcp {
            client_max_body_size 1M;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Vary' 'Origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Origin, X-Requested-With, Accept, Mcp-Session-Id, Last-Event-ID, X-RODIT-Token' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=utf-8';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Vary' 'Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Expose-Headers' 'Mcp-Session-Id' always;

            proxy_pass http://syntheticlc-container:8080;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $edge_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        location / {
            limit_req zone=public_api_limit burst=6101 nodelay;
            client_max_body_size 1M;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Vary' 'Origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Origin, X-Requested-With, Accept, X-RODIT-Token, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=utf-8';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Vary' 'Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            proxy_pass http://syntheticlc-container:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $edge_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_intercept_errors on;
            error_page 413 414 = @request_error;
            error_page 502 504 = @handle_error;
        }

        location /health {
            access_log off;
            proxy_pass http://syntheticlc-container:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        location @request_error {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Vary' 'Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Type' 'application/json' always;
            return 400 '{"error":{"code":"REQUEST_HEADER_TOO_LARGE","message":"Request headers or payload exceed size limits"},"requestId":"$edge_request_id","timestamp":"$time_iso8601"}';
        }

        location @handle_error {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Vary' 'Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Type' 'application/json' always;
            return 502 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The API gateway could not reach the application server"},"requestId":"$edge_request_id","timestamp":"$time_iso8601"}';
        }
    }
}
